<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <!-- Double Concentric 8-Pointed Star (Orange) -->
  <g stroke="#F15A24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Star Lines -->
    <path
      d="M120 18 L146 44 L182 44 L182 80 L208 106 L182 132 L182 168 L146 168 L120 194 L94 168 L58 168 L58 132 L32 106 L58 80 L58 44 L94 44 Z"
      stroke-width="5.5"
    />
    <!-- Inner Star Lines (Parallel Offset) -->
    <path
      d="M120 28 L142 50 L172 50 L172 80 L194 102 L172 124 L172 154 L142 154 L120 176 L98 154 L68 154 L68 124 L46 102 L68 80 L68 50 L98 50 Z"
      stroke-width="4.5"
    />
  </g>

  <!-- Persian Calligraphy "علامه حلی" (Navy / Cobalt Blue #1D3B8B) -->
  <g fill="none" stroke="#1D3B8B" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tall vertical Alef of Allameh on the left -->
    <path
      d="M48 64 Q50 115 54 168"
      stroke-width="7"
    />
    <!-- Ain (ع) loop and body -->
    <path
      d="M32 144 C24 154 22 170 38 174 C54 178 72 168 86 164"
      stroke-width="7"
    />
    <path
      d="M44 148 C36 138 28 142 26 152 C24 162 36 166 48 166"
      stroke-width="6"
    />
    <!-- Connecting line / Kashida of Allameh -->
    <path
      d="M50 166 L124 164"
      stroke-width="7.5"
    />
    <!-- Meem (م) hook and loop below baseline -->
    <path
      d="M116 164 C116 178 120 192 128 190 C136 188 136 172 134 164"
      stroke-width="6.5"
    />
    <!-- Final Heh (ه) and Kashida end -->
    <path
      d="M134 164 C152 162 172 162 188 166 C194 168 196 186 174 188 C154 190 142 184 138 178"
      stroke-width="6.5"
    />

    <!-- "حلی" (Helli) positioned diagonally above and to the right -->
    <!-- Head of Haa (ح) -->
    <path
      d="M102 128 C116 142 134 156 150 160"
      stroke-width="7"
    />
    <path
      d="M148 160 L122 132 C134 126 154 122 172 136"
      stroke-width="7"
    />
    <!-- Upright stroke of Laam (ل) of Helli -->
    <path
      d="M148 116 L152 162"
      stroke-width="7"
    />
    <!-- Yeh (ی) sweeping loop -->
    <path
      d="M152 160 C166 156 184 148 192 134 C198 122 188 112 178 114"
      stroke-width="6.5"
    />
  </g>
</svg>
